# ChannelExport.yaml

type: object
required:
  - id
  - id_text
  - title
  - feed_id
  - podcast_index_id
properties:
  # Base Channel fields (all included in export)
  id:
    type: integer
    description: Unique numeric ID for the channel
    example: 1

  id_text:
    type: string
    maxLength: 15
    description: Public-facing short ID for URLs
    example: "284106psal33xh"

  slug:
    type: string
    maxLength: 100
    nullable: true
    description: URL-friendly slug
    example: "stay-at-girl"

  feed_id:
    type: integer
    description: ID of the associated feed
    example: 1

  podcast_index_id:
    type: integer
    description: External Podcast Index identifier
    example: 88067

  podcast_guid:
    type: string
    format: uuid
    nullable: true
    description: "`<podcast:guid>` from the RSS feed"
    example: "e2e03fd2-c96f-4fee-aa83-20ebe6f61054"

  title:
    type: string
    maxLength: 255
    description: Title of the podcast or media channel
    example: "Water issue."

  sortable_title:
    type: string
    maxLength: 255
    nullable: true
    description: Lowercased, normalized version of title for sorting
    example: "law"

  medium_id:
    type: integer
    description: Foreign key to the `medium` table
    example: 15

  has_podcast_index_value:
    type: boolean
    description: Indicates if channel uses Podcast Index's value tag data
    example: true

  has_value_time_splits:
    type: boolean
    description: Indicates whether channel items use value time split logic
    example: true

  # Flattened relationship fields (computed for export)
  medium_name:
    type: string
    nullable: true
    description: Medium type name (flattened from medium.value)
    example: "audiobookL"

  feed_url:
    type: string
    format: uri
    nullable: true
    description: URL of the associated RSS feed (flattened from feed.url)
    example: "https://austin.net/vote-information-production-eae170/rss"

  feed_status:
    type: string
    nullable: true
    description: Status of the associated feed (flattened from feed.flag_status.status)
    example: "archived"

  # Flattened statistics fields (computed for export)
  stats_all_time_count:
    type: integer
    description: All-time event count (flattened from stats[0].all_time_count)
    example: 6466

  stats_month_current_count:
    type: integer
    description: Current month event count (flattened from stats[0].month_current_count)
    example: 1691

  stats_week_current_count:
    type: integer
    description: Current week event count (flattened from stats[0].week_current_count)
    example: 677

  stats_day_current_count:
    type: integer
    description: Current day event count (flattened from stats[0].day_current_count)
    example: 131 