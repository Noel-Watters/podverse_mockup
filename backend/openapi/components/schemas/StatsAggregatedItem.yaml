type: object
required:
  - id
  - item_id
properties:
  id:
    type: integer
    description: Unique identifier for aggregated item stats
    example: 201
  
  item_id:
    type: integer
    description: Foreign key reference to item table
    example: 200
  
  # Daily counts (current + 8 historical days)
  day_current_count:
    type: integer
    description: Current day's aggregated count
    example: 45
    default: 0
  
  day_1_count:
    type: integer
    description: Previous day's count (1 day ago)
    example: 42
    default: 0
  
  day_2_count:
    type: integer
    description: Count from 2 days ago
    example: 38
    default: 0
  
  day_3_count:
    type: integer
    description: Count from 3 days ago
    example: 35
    default: 0
  
  day_4_count:
    type: integer
    description: Count from 4 days ago
    example: 31
    default: 0
  
  day_5_count:
    type: integer
    description: Count from 5 days ago
    example: 28
    default: 0
  
  day_6_count:
    type: integer
    description: Count from 6 days ago
    example: 24
    default: 0
  
  day_7_count:
    type: integer
    description: Count from 7 days ago
    example: 21
    default: 0
    
  day_8_count:
    type: integer
    description: Count from 8 days ago
    example: 18
    default: 0

  # Weekly counts (current + 4 historical weeks)
  week_current_count:
    type: integer
    description: Current week's aggregated count
    example: 264
    default: 0

  week_1_count:
    type: integer
    description: Previous week's count (1 week ago)
    example: 198
    default: 0

  week_2_count:
    type: integer
    description: Count from 2 weeks ago
    example: 156
    default: 0

  week_3_count:
    type: integer
    description: Count from 3 weeks ago
    example: 132
    default: 0

  week_4_count:
    type: integer
    description: Count from 4 weeks ago
    example: 108
    default: 0

  # Monthly counts (current + 1 historical month)
  month_current_count:
    type: integer
    description: Current month's aggregated count
    example: 858
    default: 0

  month_1_count:
    type: integer
    description: Previous month's count (1 month ago)
    example: 654
    default: 0

  # All time total
  all_time_count:
    type: integer
    description: All-time cumulative count
    example: 4276
    default: 0