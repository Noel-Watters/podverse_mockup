type: object
required:
  - logs
  - page
  - limit
  - total_items
  - total_pages
  - has_next
  - has_prev
properties:
  logs:
    type: array
    description: Array of export log objects
    items:
      $ref: "./ExportLog.yaml"
  
  # Pagination metadata
  page:
    type: integer
    description: Current page number
    minimum: 1
    example: 1
  
  limit:
    type: integer
    description: Number of items per page
    minimum: 1
    maximum: 100
    example: 3
  
  total_items:
    type: integer
    description: Total number of export logs matching the query
    minimum: 0
    example: 42
  
  total_pages:
    type: integer
    description: Total number of pages available
    minimum: 1
    example: 14
  
  has_next:
    type: boolean
    description: Whether there are more pages after the current page
    example: true
  
  has_prev:
    type: boolean
    description: Whether there are pages before the current page
    example: false 