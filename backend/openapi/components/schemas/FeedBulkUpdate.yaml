# Schema for bulk update response
type: object
properties:
  updated:
    type: integer
    description: Number of feeds successfully updated
    example: 3

  not_found:
    type: integer
    description: Number of feeds not found
    example: 0

  total_requested:
    type: integer
    description: Total number of feeds requested for update
    example: 3

  results:
    type: array
    items:
      type: object
      properties:
        feed_id:
          type: integer
          description: ID of the feed
          example: 123
        status:
          type: string
          enum: [updated, not_found]
          description: Status of the update operation
          example: "updated"
      required: [feed_id, status]

required: [updated, not_found, total_requested, results]
