type: object
required:
  - id
  - id_text
  - title
  - feed_id
  - podcast_index_id
  - medium_id
  - has_podcast_index_value
  - has_value_time_splits
  - categories
  - medium
  - feed_url
properties:
  id:
    type: integer
    description: Unique numeric ID for the channel
    example: 201

  id_text:
    type: string
    maxLength: 15
    description: Public-facing short ID for URLs
    example: "ch_8a3f91"

  slug:
    type: string
    maxLength: 100
    nullable: true
    description: URL-friendly slug
    example: "the-daily-news"

  feed_id:
    type: integer
    description: ID of the associated feed
    example: 104

  podcast_index_id:
    type: integer
    description: External Podcast Index identifier
    example: 872361

  podcast_guid:
    type: string
    format: uuid
    nullable: true
    description: "`<podcast:guid>` from the RSS feed"
    example: "1e8f3d7c-7fc0-4b70-90e1-991ed05bc4c4"

  title:
    type: string
    maxLength: 255
    description: Title of the podcast or media channel
    example: "The Daily News Podcast"

  sortable_title:
    type: string
    maxLength: 255
    nullable: true
    description: Lowercased, normalized version of title for sorting
    example: "daily news podcast"

  medium_id:
    type: integer
    nullable: true
    description: Foreign key to the `medium` table
    example: 2

  has_podcast_index_value:
    type: boolean
    description: Indicates if channel uses Podcast Index's value tag data
    example: false

  has_value_time_splits:
    type: boolean
    description: Indicates whether channel items use value time split logic
    example: true

  feed_url:
    type: string
    format: uri
    nullable: true
    description: URL of the associated RSS feed
    example: "https://example.com/feed.xml"

  categories:
    type: array
    description: Categories associated with this channel
    items:
      type: object
      required:
        - id
        - display_name
        - mapping_key
        - parent_id
        - slug
      properties:
        id:
          type: integer
          description: Category ID
          example: 210
        parent_id:
          type: integer
          nullable: true
          description: ID of parent category for hierarchical structure
          example: null
        display_name:
          type: string
          description: Category display name
          example: "Soccer"
        slug:
          type: string
          description: URL-friendly slug for the category
          example: "soccer"
        mapping_key:
          type: string
          description: Internal category mapping key
          example: "buddhism"

  medium:
    type: object
    nullable: true
    required:
      - value
    properties:
      value:
        type: string
        description: |
          Medium type value indicating the content format:
          - `podcast`: Traditional audio podcast
          - `music`: Music content
          - `blogL`: Blog-style content
          - `publisherL`: Publisher content
          - `course`: Educational course content
          - `film`: Video/film content
          - `mixed`: Mixed media content
        example: "blogL"
