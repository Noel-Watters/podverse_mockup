# use for responses 
type: object
required:
  - id
  - url
properties:
  id:
    type: integer
    description: Feed ID (primary key)
    example: 104

  url:
    type: string
    format: uri
    maxLength: 2083
    description: RSS feed URL
    example: https://example.com/rss.xml

  is_parsing:
    type: boolean
    nullable: true
    description: Whether the feed is currently being parsed
    default: false
    example: false

  parsing_priority:
    type: integer
    nullable: true
    minimum: 0
    maximum: 5
    description: Frequency tier for parsing; 0 = rarely, 5 = frequently
    default: 0
    example: 2

  last_parsed_file_hash:
    type: string
    maxLength: 64
    nullable: true
    description: Hash of last parsed feed XML used for change detection
    example: "c4ca4238a0b923820dcc509a6f75849b"

  container_id:
    type: string
    maxLength: 12
    nullable: true
    description: ID of the container instance that last parsed the feed
    example: "ab12cd34ef56"

  created_at:
    type: string
    format: date-time
    nullable: true
    description: Timestamp when the feed was added
    example: 2025-06-17T22:00:00Z

  updated_at:
    type: string
    format: date-time
    nullable: true
    description: Timestamp when the feed was last updated
    example: 2025-06-18T14:05:00Z

  flag_status:
    type: string
    description: Human-readable flag status (e.g., active, archived, spam, parse_error)
    example: "active"
    enum: ["active", "archived", "spam", "parse_error", "fetch_error", "always-parse", "pending-archive", "takedown"]

  channel_title:
    type: string
    nullable: true
    description: Title of the associated channel (first channel if multiple exist)
    example: "Example Podcast"

  channel_podcast_index_id:
    type: integer
    nullable: true
    description: Podcast Index ID of the associated channel
    example: 12345

  recent_logs:
    type: array
    items:
      $ref: "./FeedLog.yaml"
    description: The 2 most recent parsing logs for this feed
