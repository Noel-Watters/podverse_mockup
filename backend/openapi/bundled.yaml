  /channels/export:
    get:
      summary: Export channel data in CSV or JSON format
      description: |
        Export comprehensive channel data in CSV or JSON format with flattened relationship data.
        Provides the same filtering and sorting options as the list endpoint but without pagination limits.

        **Export Data Structure:**
        - **Core Channel Fields**: id, id_text, slug, title, sortable_title, podcast_guid, feed_id, medium_id
        - **Technical Configuration**: has_podcast_index_value, has_value_time_splits, podcast_index_id
        - **Flattened Relationships**:
          - `medium_name`: Flattened from medium.value (e.g., "podcast", "blogL", "course")
          - `feed_url`: Flattened from feed.url (RSS feed URL)
          - `feed_status`: Flattened from feed.flag_status.status (feed parsing status)
          - `stats_*_count`: Flattened from stats aggregated data (all_time, month, week, day)

        **Export Formats:**
        - **CSV**: Returns downloadable file with proper headers and Content-Disposition
        - **JSON**: Returns structured array for programmatic processing

        **Filtering & Sorting:**
        Supports all the same options as list endpoint:
        - Text search on channel titles
        - Specific channel ID or podcast index ID filtering
        - Sorting by id or title (ascending/descending)
        - Row limit control via `max_rows` (default: 10,000, max: 50,000)

        **Performance & Limits:**
        - Eager loading prevents N+1 queries on large exports
        - Automatic row limit enforcement for server protection
        - Export logging for audit trails and monitoring
        - Timestamp-based filename generation for uniqueness

        **Use Cases:**
        - Analytics and business intelligence reporting
        - Data migration and backup operations
        - Channel performance analysis
        - Integration with external analytics platforms
        - Bulk data processing and transformation

        **Rate Limiting**: 10 requests per minute (lower due to potentially large data transfers)
        **Authentication**: Requires Auth0 Bearer token with admin access
      tags:
        - Channels
      security:
        - Auth0Bearer: []
      parameters:
        - $ref: '#/components/parameters/export_format'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/sort_by'
        - $ref: '#/components/parameters/sort_order'
        - $ref: '#/components/parameters/id_filter'
        - $ref: '#/components/parameters/podcast_index_id'
        - $ref: '#/components/parameters/export_by'
        - name: max_rows
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 10000
          description: |
            Maximum number of rows to export (for performance). 
            Valid range: 1-50000. Values outside this range will fall back to 10000 (default).
      responses:
        '200':
          description: Channel data exported successfully
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename=channels_export_20250725_063737_876549_admin_example_com.csv
              description: Download filename with timestamp (CSV format only)
            Content-Type:
              schema:
                type: string
                enum:
                  - text/csv
                  - application/json
                example: text/csv
              description: Content type based on export format
          content:
            text/csv:
              schema:
                type: string
                format: binary
                description: |
                  CSV file with headers and flattened channel data.
                  Includes all core fields plus computed relationship fields.
                  Headers are dynamically generated from the export schema.
                example: |
                  id,id_text,slug,title,feed_id,medium_name,feed_url,stats_all_time_count
                  1,1130284ogiop7h,learn-away-travel,Light.,1,blogL,https://smith.net/feed.xml,6466
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Channel object with flattened export data
                description: |
                  JSON array of channel objects with all flattened relationship data.
                  Same data as CSV but in structured format for API consumption.
                example:
                  - id: 1
                    id_text: 1130284ogiop7h
                    title: Light.
                    medium_name: blogL
                    feed_url: https://smith.net/feed.xml
                    stats_all_time_count: 6466
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalServerError'
