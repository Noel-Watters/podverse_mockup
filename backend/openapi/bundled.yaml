  /admin/export_logs/{log_id}:
    get:
      tags:
        - Export Logs
      summary: Get export log details
      description: |
        Retrieve detailed information about a specific export log by ID with complete metadata and computed fields.
        Returns the same data structure as list items but for a single export log.

        **Data Included**:
        - **Export Metadata**: ID, source, format, user attribution, creation/completion times
        - **Filter Context**: Complete filter conditions that were applied during export
        - **Result Counts**: Number of records exported by type (channels_count, feeds_count, items_count)
        - **Status Information**: Current status, error messages (if any), file path
        - **Computed Fields**:
          - `duration`: Export execution time in seconds (null if not completed)
          - `is_expired`: File expiration status based on 30-day retention policy
          - `has_file`: Real-time file existence check on server filesystem

        **Use Cases**:
        - Get comprehensive status of specific export operations
        - Verify export parameters and filter conditions used
        - Check file availability before initiating download
        - Debug export issues with complete context and timing
        - Audit trail verification for compliance reporting

        **Rate Limit**: 100 requests per day
      security:
        - Auth0Bearer: []
      parameters:
        - name: log_id
          in: path
          required: true
          description: Unique identifier of the export log
          schema:
            type: integer
            minimum: 1
          example: 25
      responses:
        '200':
          description: Export log retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Export log not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Export log not found (Status Code: 404)'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/export_logs/{log_id}/download:
    get:
      tags:
        - Export Logs
      summary: Download export file
      description: |
        Download the exported file for a specific export log in its original format (CSV or JSON).
        Handles both local file serving and S3 URL redirects seamlessly.

        **File Handling**:
        - **Local Files**: Served directly with proper headers and MIME types
        - **S3 URLs**: Redirects to S3 URL for direct download
        - **File Types**: Automatically detects CSV or JSON based on export format
        - **Headers**: Sets Content-Disposition for proper filename and download behavior

        **File Availability Requirements**:
        - Export must have `status: "success"` (only successful exports have files)
        - File must exist on server or S3 (`has_file: true` in log response)
        - File must not be expired (`is_expired: false` based on retention policy)
        - Valid file_path must be present in export log

        **Response Formats**:
        - **CSV**: `text/csv` MIME type with comma-separated values and headers
        - **JSON**: `application/json` MIME type with structured data

        **Response Headers**:
        - `Content-Type`: Automatically set based on export format
        - `Content-Disposition`: attachment with original timestamped filename
        - `Content-Length`: File size information
        - Cache control headers to prevent unwanted caching

        **Use Cases**:
        - Download completed export data for external analysis
        - Integrate exported data into business intelligence tools
        - Create data backups and archival copies
        - Share export results with stakeholders
        - Process exported data through custom applications

        **Rate Limit**: 50 requests per day
      security:
        - Auth0Bearer: []
      parameters:
        - name: log_id
          in: path
          required: true
          description: Unique identifier of the export log
          schema:
            type: integer
            minimum: 1
          example: 25
      responses:
        '200':
          description: Export file download successful
          headers:
            Content-Disposition:
              description: File attachment header with timestamped filename
              schema:
                type: string
                example: attachment; filename=feeds_export_20250718_214804_e0b23bf0.csv
            Content-Type:
              description: File MIME type based on export format
              schema:
                type: string
                enum:
                  - application/json
                  - text/csv
                example: text/csv
            Content-Length:
              description: File size in bytes
              schema:
                type: integer
                example: 187
          content:
            text/csv:
              schema:
                type: string
                description: |
                  CSV format with headers and data rows. Structure depends on source:
                  - **channels**: Channel data with id, title, metadata columns
                  - **feeds**: Feed data with id, url, parsing info columns
                  - **items**: Item data with id, title, publication info columns
                example: |
                  id,url,parsing_priority
                  1,https://example.com/feed1.xml,2
                  2,https://example.com/feed2.xml,0
            application/json:
              schema:
                type: array
                description: |
                  JSON array of objects. Structure depends on source and selected fields:
                  - **channels**: Array of channel objects
                  - **feeds**: Array of feed objects  
                  - **items**: Array of item objects
                items:
                  type: object
                  description: Object structure varies based on source and selected fields
                example:
                  - id: 1
                    url: https://example.com/feed1.xml
                    parsing_priority: 2
                  - id: 2
                    url: https://example.com/feed2.xml
                    parsing_priority: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Export log or file not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Export file not found or has expired (Status Code: 404)'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/reports/custom:
    post:
      summary: Generate custom data export report
      description: |
        Creates a flexible custom export report with dynamic field selection, advanced filtering, and multiple output formats.
        Generates timestamped export files and creates comprehensive audit logs for tracking and compliance.

        **Data Sources**:
        - **`channels`**: Export channel/podcast data from the channels table 
        - **`feeds`**: Export RSS feed data from the feeds table 
        - **`stats_items`**: Export item statistics from stats_aggregated_item table 
        - **`stats_channels`**: Export channel statistics from stats_aggregated_channel table 

        **Dynamic Field Selection**:
        - Specify exactly which database columns to include in the export
        - Field names must match actual database column names
        - Supports any combination of available fields for flexible reporting

        **Advanced Filtering System**:
        - **`__gt`**: Greater than (e.g., `day_current_count__gt: 100`)
        - **`__lt`**: Less than (e.g., `parsing_priority__lt: 3`)
        - **`__gte`**: Greater than or equal to (e.g., `id__gte: 50`)
        - **`__lte`**: Less than or equal to (e.g., `all_time_count__lte: 1000`)
        - **`__eq`**: Equal to (default if no operator specified)
        - **`__ne`**: Not equal to (e.g., `parsing_priority__ne: 0`)
        - **`__ilike`**: Case-insensitive pattern matching (e.g., `title__ilike: "podcast"`)

        **Export Formats**:
        - **CSV**: Comma-separated values with headers, optimized for spreadsheet applications and data analysis
        - **JSON**: Structured data with proper typing, ideal for programmatic processing and API integration

        **File Management**:
        - Creates timestamped files in format: `{source}_custom_export_{YYYYMMDD_HHMMSS}.{format}`
        - Files stored in dedicated exports directory for organized access
        - Automatic directory creation if needed

        **Audit & Logging**:
        - Creates detailed export log entries for compliance and tracking
        - Includes user attribution, source data, filter conditions, and execution metadata
        - Tracks export count and completion status

        **Validation & Error Handling**:
        - Comprehensive input validation with detailed error messages
        - Required field enforcement (source, selected_fields, format, export_by)
        - Email format validation for export attribution
        - Source and format enum validation

        **Use Cases**:
        - Custom analytics reports with specific field combinations
        - Filtered data exports for external analysis tools
        - Bulk data migration and backup operations
        - Compliance reporting with audit trails
        - Integration data feeds for external systems

        **Rate Limiting**: Not explicitly limited (handles potentially large datasets) 
      tags:
        - Reports
      security:
        - Auth0Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomReportRequest'
      responses:
        '200':
          description: Export report generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomReportResponse'
        '400':
          description: Validation error - invalid parameters or missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Validation Error
                      status_code:
                        type: integer
                        example: 400
                      errors:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: string
                        example:
                          source:
                            - 'Must be one of: channels, feeds, stats_items, stats_channels.'
                          export_by:
                            - Not a valid email address.
                          selected_fields:
                            - Missing data for required field.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Data integrity constraint violation (known issue with stats sources)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Data integrity constraint violation
                      status_code:
                        type: integer
                        example: 409
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    Auth0Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Auth0
  parameters:
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Max number of results to return
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Page number for pagination
    search:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: |
        Search term to filter results. Supports multiple search modes. For more details, see the search section in the under each endpoint.
        Search is case-insensitive and uses OR ILIKE logic across all fields.
    id_filter:
      name: id
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Filter by specific ID
    podcast_index_id:
      name: podcast_index_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Filter by specific Podcast Index ID
    sort_order:
      name: sort_order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
      description: Sort order (ascending or descending).
    sort_by:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
      description: Field to sort by
    feed_id:
      name: feed_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID of the feed to operate on
      example: 123
    export_format:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum:
          - csv
          - json
        default: csv
      description: Filter by export format (csv or json)
    export_by:
      name: export_by
      in: query
      required: false
      schema:
        type: string
        format: email
      description: Filter by user email who initiated the export
    view:
      name: view
      in: query
      required: false
      schema:
        type: string
        enum:
          - daily
          - weekly
          - monthly
          - all_time
        default: monthly
      description: Time period view for statistics data for response format options
    export_logs_status:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - pending
          - success
          - failed
          - skipped
          - expired
      description: Filter by export status
    export_logs_source:
      name: source
      in: query
      required: false
      schema:
        type: string
        enum:
          - channels
          - feeds
      description: Filter by source of exported data.
    export_logs_has_error:
      name: has_error
      in: query
      required: false
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
      description: Filter by whether the export has an error (true for failed status, false for non-failed status)
    export_logs_min_duration:
      name: min_duration
      in: query
      required: false
      schema:
        type: number
        format: float
        minimum: 0
      description: Filter by minimum duration in seconds (only applies to completed exports)
    export_logs_max_duration:
      name: max_duration
      in: query
      required: false
      schema:
        type: number
        format: float
        minimum: 0
      description: Filter by maximum duration in seconds (only applies to completed exports)
    export_logs_start_date:
      name: start_date
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Filter by start date (created_at >= start_date). Must be used with end_date.
    export_logs_end_date:
      name: end_date
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Filter by end date (created_at <= end_date). Must be used with start_date.
    time_filter:
      name: time_filter
      in: query
      description: Filter results by time window (e.g., daily, weekly, monthly)
      required: false
      schema:
        type: string
        enum:
          - daily
          - weekly
          - monthly
    flag_status:
      name: flag_status
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - archived
          - spam
          - parse_error
          - fetch_error
          - always-parse
          - pending-archive
          - takedown
      description: Filter by feed flag status
    id:
      $ref: '#/components/parameters/id_filter'
    format:
      $ref: '#/components/parameters/export_format'
    end_date:
      $ref: '#/components/parameters/export_logs_end_date'
    has_error:
      $ref: '#/components/parameters/export_logs_has_error'
    max_duration:
      $ref: '#/components/parameters/export_logs_max_duration'
    min_duration:
      $ref: '#/components/parameters/export_logs_min_duration'
    start_date:
      $ref: '#/components/parameters/export_logs_start_date'
    status:
      $ref: '#/components/parameters/export_logs_status'
    source:
      $ref: '#/components/parameters/export_logs_source'
  schemas:
    FeedLog:
