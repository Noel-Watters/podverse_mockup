        - item_id
        - created_at
        - event_type
      properties:
        id:
          type: integer
          description: Unique identifier for the event
          example: 1
        account_guid:
          type: string
          format: uuid
          description: UUID of the account that triggered the event
          example: 123e4567-e89b-12d3-a456-426614174000
        item_id:
          type: integer
          description: ID of the item this event is for
          example: 42
        created_at:
          type: string
          format: date-time
          description: When the event occurred
          example: '2024-01-15T10:30:00Z'
        event_type:
          type: string
          enum:
            - listen
            - view
            - share
            - download
            - favorite
            - unfavorite
          description: Type of event
          example: listen
        metadata:
          type: object
          description: Additional metadata about the event (implementation specific)
          additionalProperties: true
    Item:
      type: object
      required:
        - id
        - id_text
        - channel_id
        - title
        - item_flag_status_id
      properties:
        id:
          type: integer
          description: Unique identifier for the item
          example: 1
        id_text:
          type: string
          maxLength: 64
          description: Short identifier used in public-facing URLs
          example: ep_2a3f9c
        slug:
          type: string
          maxLength: 100
          nullable: true
          description: URL-friendly slug for the item
          example: episode-1-getting-started
        channel_id:
          type: integer
          description: ID of the channel this item belongs to
          example: 42
        guid:
          type: string
          maxLength: 2083
          nullable: true
          description: RSS `<guid>` of the item (either guid or guid_enclosure_url must be present)
          example: https://example.com/items/1
        guid_enclosure_url:
          type: string
          maxLength: 2083
          nullable: true
          description: Enclosure URL from RSS used as fallback if GUID is missing (either guid or guid_enclosure_url must be present)
          example: https://example.com/items/ep1.mp3
        pub_date:
          type: string
          format: date-time
          nullable: true
          description: Publication date of the item
          example: '2024-01-15T10:30:00Z'
        title:
          type: string
          maxLength: 255
          description: Title of the item (usually the episode title)
          example: 'Episode 1: Getting Started'
        item_flag_status_id:
          type: integer
          description: Foreign key to the item_flag_status table
          example: 1
        flag_status:
          $ref: '#/components/schemas/ItemFlagStatus'
        stats:
          $ref: '#/components/schemas/StatsAggregatedItem'
        events:
          type: array
          items:
            $ref: '#/components/schemas/StatsTrackEventItem'
          description: Item tracking events
    ExportLog:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the export log
          example: 25
        export_by:
          type: string
          description: Email of the user who triggered the export or system
          example: nicholasgriffin@example.com
        export_type:
          type: string
          enum:
            - channels
            - feeds
            - items
          description: Type of data being exported
          example: feeds
        status:
          type: string
          enum:
            - pending
            - success
            - failed
            - skipped
            - expired
          description: Current status of the export operation
          example: success
        format:
          type: string
          enum:
            - csv
            - json
          description: File format of the export
          example: csv
        file_path:
          type: string
          nullable: true
          description: Path to the exported file on the server
          example: /app/exports/feeds_export_20250718_214804_e0b23bf0.csv
        filters:
          type: object
          nullable: true
          description: JSON object containing search and filter parameters used for the export
          example:
            date_from: '2025-06-18T21:48:04.595674'
            date_to: '2025-07-18T21:48:04.595676'
            status: active
        channels_count:
          type: integer
          nullable: true
          description: Number of channels exported (only for channel exports)
          example: 400
        feeds_count:
          type: integer
          nullable: true
          description: Number of feeds exported (only for feed exports)
          example: 100
        items_count:
          type: integer
          nullable: true
          description: Number of items exported (only for item exports)
        created_at:
          type: string
          format: date-time
          description: Timestamp when the export was initiated
          example: '2025-07-18T19:48:04.595678'
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the export was completed
          example: '2025-07-18T21:42:04.595596'
        error_message:
          type: string
          nullable: true
          description: Error message if the export failed
        duration:
          type: number
          nullable: true
          description: Duration of the export operation in seconds
          example: 6839.999918
        is_expired:
          type: boolean
          description: Whether the export file has expired
          example: false
        has_file:
          type: boolean
          description: Whether the export file exists on the server
          example: false
      required:
        - id
        - export_by
        - export_type
        - status
        - format
        - created_at
        - is_expired
        - has_file
    ExportLogsResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/ExportLog'
          description: Array of export logs
        page:
          type: integer
          description: Current page number
          example: 1
        limit:
          type: integer
          description: Number of items per page
          example: 10
        total_items:
          type: integer
          description: Total number of export logs
          example: 32
        total_pages:
          type: integer
          description: Total number of pages
          example: 4
        has_next:
          type: boolean
          description: Whether there is a next page
          example: true
        has_prev:
          type: boolean
          description: Whether there is a previous page
          example: false
      required:
        - logs
        - page
        - limit
        - total_items
        - total_pages
        - has_next
        - has_prev
  responses:
    BadRequest:
      description: Bad request (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimit:
      description: Rate limit exceeded (429)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error (500)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Unsupported media type (415)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
