  /admin/export_logs:
    get:
      tags:
        - Export Logs
      summary: List export logs
      description: |
        Retrieve a paginated list of export logs with comprehensive filtering, sorting, and search capabilities.

        **Features:**
        - **Pagination**: Control page size and navigation with `page` and `limit` parameters
        - **Filtering**: Filter by status, export type, user email, format, date ranges, duration, error status, and specific ID
        - **Sorting**: Sort by any field including computed duration (created_at, completed_at, status, export_type, format, duration)
        - **Search**: Search within error messages using `search_term`
        - **Real-time Data**: Get current file existence and expiration status

        **Available Filters:**
        - `status`: pending, success, failed, skipped, expired
        - `export_type`: channels, feeds, items
        - `format`: csv, json
        - `export_by`: User email who initiated the export
        - `id`: Specific export log ID
        - `has_error`: true/false to filter by error status
        - `min_duration`/`max_duration`: Duration range in seconds (only for completed exports)
        - `start_date`/`end_date`: Date range for created_at (must be used together)
        - `search_term`: Search in error messages (case-insensitive)

        **Use Cases:**
        - Monitor export job status and progress
        - Track user export activity and usage
        - Analyze export performance and duration
        - Debug failed exports by searching error messages
        - Generate reports on export history

        **Primary table:** `export_log`
        **Related tables:** None

        **Authentication Required**: Bearer token

        **Rate Limit**: 100 requests per day
      security:
        - Auth0Bearer: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/export_logs_status'
        - $ref: '#/components/parameters/export_format'
        - $ref: '#/components/parameters/export_by'
        - $ref: '#/components/parameters/id_filter'
        - $ref: '#/components/parameters/export_logs_export_type'
        - $ref: '#/components/parameters/export_logs_has_error'
        - $ref: '#/components/parameters/export_logs_min_duration'
        - $ref: '#/components/parameters/export_logs_max_duration'
        - $ref: '#/components/parameters/export_logs_start_date'
        - $ref: '#/components/parameters/export_logs_end_date'
      responses:
        '200':
          description: Successfully retrieved export logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportLogsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/export_logs/{log_id}:
    get:
      tags:
        - Export Logs
      summary: Get export log details
      description: |
        Retrieve detailed information about a specific export log by ID, including computed fields and real-time status.

        **Computed Fields:**
        - **duration**: Calculated time difference between created_at and completed_at
        - **is_expired**: Whether the export file has expired (based on retention policy)
        - **has_file**: Whether the export file currently exists on the server

        **Use Cases:**
        - Get detailed status of a specific export job
        - Check if export file is still available for download
        - Monitor export progress and completion time
        - Debug export issues with full context
        - Verify export parameters and filters used

        **Authentication Required**: Bearer token

        **Rate Limit**: 100 requests per day
      security:
        - Auth0Bearer: []
      parameters:
        - name: log_id
          in: path
          required: true
          description: Unique identifier of the export log
          schema:
            type: integer
            minimum: 1
          example: 25
      responses:
        '200':
          description: Successfully retrieved export log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/export_logs/{log_id}/download:
    get:
      tags:
        - Export Logs
      summary: Download export file
      description: |
        Download the exported file for a specific export log in its original format (CSV or JSON).

        **File Formats:**
        - **CSV**: Comma-separated values with headers, suitable for spreadsheet applications
        - **JSON**: Structured data format, suitable for programmatic processing

        **File Availability:**
        - Only available for exports with `status: "success"`
        - File must exist on server (`has_file: true`)
        - File must not be expired (`is_expired: false`)
        - For S3 URLs, redirects to the S3 URL
        - For local files, serves the file directly

        **Response Headers:**
        - `Content-Type`: application/json or text/csv
        - `Content-Disposition`: attachment with original filename

        **Use Cases:**
        - Download completed export data for analysis
        - Integrate exported data into external systems
        - Generate reports from exported data
        - Backup export results for archival purposes

        **Authentication Required**: Bearer token

        **Rate Limit**: 50 requests per day
      security:
        - Auth0Bearer: []
      parameters:
        - name: log_id
          in: path
          required: true
          description: Unique identifier of the export log
          schema:
            type: integer
            minimum: 1
          example: 25
      responses:
        '200':
          description: Successfully downloaded export file
          content:
            application/json:
              schema:
                type: object
                description: |
                  **JSON Format Response**

                  When the export format is JSON, the response contains the exported data as a JSON object.
                  The structure varies based on export_type:

                  - **channels**: Array of channel objects with properties like id, title, description, etc.
                  - **feeds**: Array of feed objects with properties like id, title, url, status, etc.
                  - **items**: Array of item objects with properties like id, title, description, duration, etc.
                properties:
                  message:
                    type: string
                    example: File downloaded successfully
            text/csv:
              schema:
                type: string
                description: |
                  **CSV Format Response**

                  When the export format is CSV, the response contains the exported data as a CSV file.
                  The CSV includes headers and data rows with the following structure:

                  **Headers**: `id,export_by,export_type,status,format,file_path,created_at,completed_at,feeds_count,channels_count,items_count,error_message`

                  **Example CSV Content**:
                  ```
                  id,export_by,export_type,status,format,file_path,created_at,completed_at,feeds_count,channels_count,items_count,error_message
                  25,nicholasgriffin@example.com,feeds,success,csv,/app/exports/feeds_export_20250718_214804_e0b23bf0.csv,2025-07-18T19:48:04.595678,2025-07-18T21:42:04.595596,400,,,
                  ```

                  **Note**: Empty fields are represented as empty strings in CSV format.
          headers:
            Content-Disposition:
              description: File attachment header with appropriate filename
              schema:
                type: string
                example: attachment; filename=feeds_export_20250718_214804_e0b23bf0.csv
            Content-Type:
              description: File MIME type based on export format
              schema:
                type: string
                enum:
                  - application/json
                  - text/csv
                example: text/csv
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Export log or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Export file not found or has expired (Status Code: 404)'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    Auth0Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Auth0
  parameters:
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Max number of results to return
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Page number for pagination
    search:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: |
        Search term to filter results. Supports multiple search modes. For more details, see the search section in the under each endpoint.
        Search is case-insensitive and uses OR ILIKE logic across all fields.
    id_filter:
      name: id
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Filter by specific ID
    podcast_index_id:
      name: podcast_index_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Filter by specific Podcast Index ID
    sort_order:
      name: sort_order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
      description: Sort order (ascending or descending).
    sort_by:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
      description: Field to sort by
    feed_id:
      name: feed_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID of the feed to operate on
      example: 123
    export_format:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum:
          - csv
          - json
        default: csv
      description: Filter by export format (csv or json)
    export_by:
      name: export_by
      in: query
      required: false
      schema:
        type: string
        format: email
      description: Filter by user email who initiated the export
    time_filter:
      name: time_filter
      in: query
      description: Filter results by time window (e.g., daily, weekly, monthly)
      required: false
      schema:
        type: string
        enum:
          - daily
          - weekly
          - monthly
    export_logs_status:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - pending
          - success
          - failed
          - skipped
          - expired
      description: Filter by export status
    export_logs_export_type:
      name: export_type
      in: query
      required: false
      schema:
        type: string
        enum:
          - channels
          - feeds
      description: Filter by export type.
    export_logs_has_error:
      name: has_error
      in: query
      required: false
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
      description: Filter by whether the export has an error (true for failed status, false for non-failed status)
    export_logs_min_duration:
      name: min_duration
      in: query
      required: false
      schema:
        type: number
        format: float
        minimum: 0
      description: Filter by minimum duration in seconds (only applies to completed exports)
    export_logs_max_duration:
      name: max_duration
      in: query
      required: false
      schema:
        type: number
        format: float
        minimum: 0
      description: Filter by maximum duration in seconds (only applies to completed exports)
    export_logs_start_date:
      name: start_date
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Filter by start date (created_at >= start_date). Must be used with end_date.
    export_logs_end_date:
      name: end_date
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Filter by end date (created_at <= end_date). Must be used with start_date.
    id:
      $ref: '#/components/parameters/id_filter'
    format:
      $ref: '#/components/parameters/export_format'
    end_date:
      $ref: '#/components/parameters/export_logs_end_date'
    has_error:
      $ref: '#/components/parameters/export_logs_has_error'
    max_duration:
      $ref: '#/components/parameters/export_logs_max_duration'
    min_duration:
      $ref: '#/components/parameters/export_logs_min_duration'
    start_date:
      $ref: '#/components/parameters/export_logs_start_date'
    status:
      $ref: '#/components/parameters/export_logs_status'
    export_type:
      $ref: '#/components/parameters/export_logs_export_type'
  schemas:
    LoginRequest:
      type: object
      properties:
        id_token:
          type: string
          description: Firebase-issued ID token from frontend
      required:
        - id_token
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        expires_in:
          type: integer
          description: Token expiration (seconds)
        user:
          type: object
          properties:
            email:
              type: string
            admin:
              type: boolean
    FeedLog:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the feed log entry
          example: 1
        feed_id:
          type: integer
          description: Foreign key reference to feed table
          example: 123
        finished_at:
          type: string
          format: date-time
          description: Timestamp when the feed log was finished
          example: '2024-01-01T10:00:00Z'
        http_status:
          type: integer
          description: HTTP status code of the response
          example: 200
        is_success:
          type: boolean
        parse_error_message:
          type: string
          description: Log message content
          example: Feed parsed successfully. All items updated with no issues.
        parse_errors:
          type: integer
          description: Number of parse errors
          example: 0
        parsed_by:
          type: string
          description: Auth0 user ID of the user who parsed the feed or system
          example: auth0|123456
        started_at:
          type: string
          format: date-time
          description: Timestamp when the feed log was started
          example: '2024-01-01T10:00:00Z'
      required:
        - id
        - feed_id
    Feed:
      type: object
      required:
        - id
        - url
      properties:
        id:
          type: integer
          description: Feed ID (primary key)
          example: 104
        url:
          type: string
          format: uri
          maxLength: 2083
          description: RSS feed URL
          example: https://example.com/rss.xml
        is_parsing:
          type: boolean
          nullable: true
          description: Whether the feed is currently being parsed
          default: false
          example: false
        parsing_priority:
          type: integer
          nullable: true
          minimum: 0
          maximum: 5
          description: Frequency tier for parsing; 0 = rarely, 5 = frequently
          default: 0
          example: 2
        last_parsed_file_hash:
          type: string
          maxLength: 64
          nullable: true
          description: Hash of last parsed feed XML used for change detection
          example: c4ca4238a0b923820dcc509a6f75849b
        container_id:
          type: string
          maxLength: 12
          nullable: true
          description: ID of the container instance that last parsed the feed
          example: ab12cd34ef56
        created_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the feed was added
          example: '2025-06-17T22:00:00Z'
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the feed was last updated
          example: '2025-06-18T14:05:00Z'
        flag_status:
          type: string
          description: Human-readable flag status (e.g., active, archived, spam, parse_error)
          example: active
