          description: Raw event count for the specified time range (computed field)
          example: 42
    Item:
      type: object
      required:
        - id
        - id_text
        - channel_id
        - title
        - item_flag_status_id
      properties:
        id:
          type: integer
          description: Unique identifier for the item
          example: 1
        id_text:
          type: string
          maxLength: 64
          description: Short identifier used in public-facing URLs
          example: 113258si1o5f8f
        title:
          type: string
          maxLength: 255
          description: Title of the item (usually the episode title)
          example: Nature call range beautiful around over tell oil.
        slug:
          type: string
          maxLength: 100
          nullable: true
          description: URL-friendly slug for the item
          example: episode-1-getting-started
        channel_id:
          type: integer
          description: ID of the channel this item belongs to
          example: 1
        guid:
          type: string
          maxLength: 2083
          nullable: true
          description: RSS `<guid>` of the item (either guid or guid_enclosure_url must be present)
          example: https://example.com/items/1
        guid_enclosure_url:
          type: string
          maxLength: 2083
          nullable: true
          description: Enclosure URL from RSS used as fallback if GUID is missing (either guid or guid_enclosure_url must be present)
          example: https://example.com/items/ep1.mp3
        pub_date:
          type: string
          format: date-time
          nullable: true
          description: Publication date of the item
          example: '2024-11-02T17:28:36.547572+00:00'
        item_flag_status_id:
          type: integer
          description: Foreign key to the item_flag_status table
          example: 1
        flag_status:
          type: object
          description: Item flag status details
          required:
            - id
            - status
          properties:
            id:
              type: integer
              description: Flag status ID
              example: 1
            status:
              type: string
              enum:
                - active
                - pending-archive
                - archived
                - pending-delete
              description: |
                Status assigned to an item to control lifecycle behavior.
                - `active`: Item is live and visible
                - `pending-archive`: Scheduled for archival  
                - `archived`: No longer active but kept in the system
                - `pending-delete`: Marked for removal
              example: active
            created_at:
              type: string
              format: date-time
              description: Timestamp of creation
              example: '2025-07-25T04:16:27.006613'
            updated_at:
              type: string
              format: date-time
              description: Timestamp of last update
              example: '2025-07-25T04:16:27.006613'
    ItemsResponse:
      type: object
      properties:
        data:
          type: array
          description: Array of item objects
          items:
            $ref: '#/components/schemas/Item'
        meta:
          type: object
          required:
            - total
            - limit
            - offset
          properties:
            total:
              type: integer
              description: Total number of items matching the query
              example: 250
            limit:
              type: integer
              description: Number of items per page
              example: 3
            offset:
              type: integer
              description: Number of items skipped (calculated as (page-1) * limit)
              example: 0
    ExportLog:
      type: object
      required:
        - id
        - export_by
        - source
        - status
        - format
        - created_at
        - is_expired
        - has_file
      properties:
        id:
          type: integer
          description: Unique identifier for the export log
          example: 25
        export_by:
          type: string
          description: Email of the user who triggered the export or system
          example: nicholasgriffin@example.com
        source:
          type: string
          enum:
            - channels
            - feeds
            - items
          description: Source of data being exported
          example: feeds
        status:
          type: string
          enum:
            - pending
            - success
            - failed
            - skipped
            - expired
          description: |
            Current status of the export operation:
            - `pending`: Export is queued or in progress
            - `success`: Export completed successfully
            - `failed`: Export encountered an error
            - `skipped`: Export was skipped (various reasons)
            - `expired`: Export file has expired and been cleaned up
          example: success
        format:
          type: string
          enum:
            - csv
            - json
          description: File format of the export
          example: csv
        file_path:
          type: string
          nullable: true
          description: |
            Path to the exported file on the server or S3 URL.
            May be null for failed/skipped exports or expired files.
          example: /app/exports/feeds_custom_export_20250725_060759.csv
        filters:
          type: object
          nullable: true
          description: |
            JSON object containing the search and filter parameters that were used for the export.
            Structure varies based on the source and specific filters applied.
          example:
            date_from: '2025-06-18T21:48:04.595674'
            date_to: '2025-07-18T21:48:04.595676'
            status: active
        channels_count:
          type: integer
          nullable: true
          description: Number of channels exported (only for channel exports)
          example: 400
        feeds_count:
          type: integer
          nullable: true
          description: Number of feeds exported (only for feed exports)
          example: 100
        items_count:
          type: integer
          nullable: true
          description: Number of items exported (only for item exports)
          example: null
        created_at:
          type: string
          format: date-time
          description: Timestamp when the export was initiated
          example: '2025-07-18T19:48:04.595678'
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Timestamp when the export was completed.
            Will be null for pending exports or exports that never completed.
          example: '2025-07-25T06:07:59.015563'
        error_message:
          type: string
          nullable: true
          description: Error message if the export failed (only present for failed exports)
          example: null
        duration:
          type: number
          nullable: true
          description: |
            Duration of the export operation in seconds (computed field).
            Calculated as the difference between completed_at and created_at.
            Will be null if export hasn't completed.
          example: 0.000004
        is_expired:
          type: boolean
          description: |
            Whether the export file has expired based on retention policy (computed field).
            Files older than 30 days are considered expired.
          example: false
        has_file:
          type: boolean
          description: |
            Whether the export file currently exists on the server (computed field).
            Checks actual file existence, not just file_path presence.
          example: true
    ExportLogsResponse:
      type: object
      required:
        - logs
        - page
        - limit
        - total_items
        - total_pages
        - has_next
        - has_prev
      properties:
        logs:
          type: array
          description: Array of export log objects
          items:
            $ref: '#/components/schemas/ExportLog'
        page:
          type: integer
          description: Current page number
          minimum: 1
          example: 1
        limit:
          type: integer
          description: Number of items per page
          minimum: 1
          maximum: 100
          example: 3
        total_items:
          type: integer
          description: Total number of export logs matching the query
          minimum: 0
          example: 42
        total_pages:
          type: integer
          description: Total number of pages available
          minimum: 1
          example: 14
        has_next:
          type: boolean
          description: Whether there are more pages after the current page
          example: true
        has_prev:
          type: boolean
          description: Whether there are pages before the current page
          example: false
    CustomReportRequest:
      type: object
      required:
        - source
        - selected_fields
        - format
        - export_by
      properties:
        source:
          type: string
          enum:
            - channels
            - feeds
            - stats_items
            - stats_channels
          description: |
            Data source table to export from:
            - `channels`: Export channel data from the channels table
            - `feeds`: Export feed data from the feeds table  
            - `stats_items`: Export item statistics from stats_aggregated_item table (currently has issues)
            - `stats_channels`: Export channel statistics from stats_aggregated_channel table (currently has issues)
          example: channels
        selected_fields:
          type: array
          items:
            type: string
          minItems: 1
          description: |
            List of field names to include in the export. Must correspond to actual database column names.

            **Available fields by source:**
            - **channels**: id, title, slug, description, podcast_index_id, podcast_guid, medium_id, etc.
            - **feeds**: id, url, parsing_priority, flag_status_id, created_at, updated_at, etc.
            - **stats_items**: id, item_id, day_current_count, week_current_count, month_current_count, all_time_count, etc.
            - **stats_channels**: id, channel_id, day_current_count, week_current_count, month_current_count, all_time_count, etc.
          example:
            - id
            - title
            - description
        filters:
          type: object
          additionalProperties: true
          description: |
            Filter conditions to apply to the data. Uses field names with optional operators.

            **Supported operators:**
            - `__gt`: Greater than (e.g., `day_current_count__gt: 100`)
            - `__lt`: Less than
            - `__gte`: Greater than or equal to
            - `__lte`: Less than or equal to
            - `__eq`: Equal to (default if no operator specified)
            - `__ne`: Not equal to
            - `__ilike`: Case-insensitive pattern matching (for text fields)

            **Examples:**
            - `{"id__gte": 1, "title__ilike": "podcast"}` - ID >= 1 AND title contains "podcast"
            - `{"parsing_priority__ne": 0}` - parsing_priority not equal to 0
            - `{"created_at__gte": "2024-01-01"}` - created after Jan 1, 2024
          example:
            id__gte: 1
            title__ilike: podcast
        format:
          type: string
          enum:
            - csv
            - json
          description: |
            Export file format:
            - `csv`: Comma-separated values with headers, suitable for spreadsheet applications
            - `json`: Structured data format with proper typing, suitable for programmatic processing
          example: csv
        export_by:
          type: string
          format: email
          description: Email address of the user requesting the export (for audit logging)
          example: admin@example.com
    CustomReportResponse:
      type: object
      required:
        - message
        - log_id
        - filename
        - count
      properties:
        message:
          type: string
          description: Success message confirming the export completion
          example: Report exported successfully
        log_id:
          type: integer
          description: ID of the export log entry created for tracking and audit purposes
          example: 123
        filename:
          type: string
          description: Generated filename for the exported file (includes timestamp)
          pattern: ^[a-z_]+_custom_export_\d{8}_\d{6}\.(csv|json)$
          example: channels_custom_export_20250725_060644.json
        count:
          type: integer
          description: Number of records successfully exported
          minimum: 0
          example: 150
    ChannelExport:
      type: object
      required:
        - id
        - id_text
        - title
        - feed_id
        - podcast_index_id
      properties:
        id:
          type: integer
          description: Unique numeric ID for the channel
          example: 1
        id_text:
          type: string
          maxLength: 15
          description: Public-facing short ID for URLs
          example: 284106psal33xh
        slug:
          type: string
          maxLength: 100
          nullable: true
          description: URL-friendly slug
          example: stay-at-girl
        feed_id:
          type: integer
          description: ID of the associated feed
          example: 1
        podcast_index_id:
          type: integer
          description: External Podcast Index identifier
          example: 88067
        podcast_guid:
          type: string
          format: uuid
          nullable: true
          description: '`<podcast:guid>` from the RSS feed'
          example: e2e03fd2-c96f-4fee-aa83-20ebe6f61054
        title:
          type: string
          maxLength: 255
          description: Title of the podcast or media channel
          example: Water issue.
        sortable_title:
          type: string
          maxLength: 255
          nullable: true
          description: Lowercased, normalized version of title for sorting
          example: law
        medium_id:
          type: integer
          description: Foreign key to the `medium` table
          example: 15
        has_podcast_index_value:
          type: boolean
          description: Indicates if channel uses Podcast Index's value tag data
          example: true
        has_value_time_splits:
          type: boolean
          description: Indicates whether channel items use value time split logic
          example: true
        medium_name:
          type: string
          nullable: true
          description: Medium type name (flattened from medium.value)
          example: audiobookL
        feed_url:
          type: string
          format: uri
          nullable: true
          description: URL of the associated RSS feed (flattened from feed.url)
          example: https://austin.net/vote-information-production-eae170/rss
        feed_status:
          type: string
          nullable: true
          description: Status of the associated feed (flattened from feed.flag_status.status)
          example: archived
        stats_all_time_count:
          type: integer
          description: All-time event count (flattened from stats[0].all_time_count)
          example: 6466
        stats_month_current_count:
          type: integer
          description: Current month event count (flattened from stats[0].month_current_count)
          example: 1691
        stats_week_current_count:
          type: integer
          description: Current week event count (flattened from stats[0].week_current_count)
          example: 677
        stats_day_current_count:
          type: integer
          description: Current day event count (flattened from stats[0].day_current_count)
          example: 131
    ItemFlagStatus:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the item flag status
          example: 2
        status:
          type: string
          enum:
            - active
            - pending-archive
            - archived
            - pending-delete
          description: |
            Status assigned to an item to control lifecycle behavior.
            - `active`: Item is live and visible
            - `pending-archive`: Scheduled for archival
            - `archived`: No longer active but kept in the system
            - `pending-delete`: Marked for removal
          example: archived
        created_at:
          type: string
          format: date-time
          description: Timestamp of creation
          example: '2024-01-01T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: Timestamp of last update
          example: '2024-01-05T09:30:00Z'
      required:
        - id
        - status
    StatsChannel:
      type: object
      properties:
        channel_id:
          type: integer
          description: Unique ID of the channel
        podcast_index_id:
          type: integer
          description: Podcast Index ID
        title:
          type: string
          description: Title of the podcast show
        total_listens:
          type: integer
          description: Total listens during the selected time period
        start_date:
          type: string
