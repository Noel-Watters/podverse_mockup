/channels:
  get:
    summary: Retrieve a list of channels
    description: |
      Retrieve a paginated list of podcast channels with comprehensive metadata and relationships.
      Returns channels with eager-loaded feed, medium, categories, and statistics data.
      
      **Data Sources:**
      - Primary table: `channel` (podcast channel metadata)
      - Joined tables: `feed` (RSS feed info), `medium` (content type), `channel_category` + `category` (categorization), `stats_aggregated_channel` (performance metrics)
      
      **Filtering Capabilities:**
      - **Text Search**: `search` parameter for case-insensitive title matching
      - **Specific Channel**: `id` parameter to filter by exact channel ID
      - **Podcast Index**: `podcast_index_id` parameter to filter by external identifier
      
      **Sorting Options:**
      - `id`: Channel ID (numeric, default ascending)
      - `title`: Channel title (alphabetical)
      - Supports both `asc` and `desc` sort orders
      
      **Response Structure:**
      - Returns paginated results with `data` array and `meta` object
      - Each channel includes nested `categories` array and `medium` object
      - Categories include `id`, `display_name`, and `mapping_key`
      - Medium provides content type classification (podcast, music, blogL, publisherL, course, film, mixed)
      
      **Use Cases:**
      - Channel discovery and browsing interfaces
      - Admin dashboard channel management
      - Content categorization and filtering
      - Performance monitoring with metadata analysis
      - Integration with external podcast platforms
      
      **Rate Limiting**: 30 requests per minute
    tags:
      - Channels
    security:
      - Auth0Bearer: []
    parameters:
      - $ref: "../components/parameters/query/limit.yaml"
      - $ref: "../components/parameters/query/page.yaml"
      - $ref: "../components/parameters/query/search.yaml"
      - $ref: "../components/parameters/query/id_filter.yaml"
      - $ref: "../components/parameters/query/podcast_index_id.yaml"
      - $ref: "../components/parameters/query/sort_order.yaml"
      - $ref: "../components/parameters/query/sort_by.yaml"
    responses:
      '200':
        description: List of channels returned
        content:
          application/json:            
            schema:
              $ref: "../components/schemas/Channel.yaml"
      '400':
        $ref: "../components/responses/BadRequest.yaml"
      '401':
        $ref: "../components/responses/Unauthorized.yaml"
      '403':
        $ref: "../components/responses/Forbidden.yaml"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"

/channels/{id}:
  get:
    summary: Retrieve a channel by ID
    description: |
      Retrieve comprehensive details for a specific channel by ID with complete relationship data.
      Returns the same structure as list items but for a single channel with enhanced category details.
      
      **Data Included:**
      - **Channel Metadata**: ID, title, slug, podcast identifiers, medium classification
      - **Feed Integration**: Associated RSS feed URL and feed ID
      - **Category Details**: Enhanced category information including parent relationships and slugs
      - **Medium Classification**: Content type with comprehensive format descriptions
      - **Technical Flags**: Podcast Index integration and value time splits configuration
      
      **Enhanced Category Format:**
      Unlike the list endpoint, individual channel responses include:
      - `parent_id`: Hierarchical category structure
      - `slug`: URL-friendly category identifiers
      - Full category metadata for improved navigation
      
      **Use Cases:**
      - Channel detail pages and profile views
      - Edit forms with complete channel context
      - Category hierarchy navigation
      - Feed relationship management
      - Technical configuration verification
      
      **Rate Limiting**: 30 requests per minute
    tags:
      - Channels
    security:
      - Auth0Bearer: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: The ID of the channel to retrieve
    responses:
      '200':
        description: Channel details retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas/ChannelDetails.yaml"
      '400':
        $ref: "../components/responses/BadRequest.yaml"
      '401':
        $ref: "../components/responses/Unauthorized.yaml"
      '403':
        $ref: "../components/responses/Forbidden.yaml"
      '404':
        description: Channel not found
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Channel with ID 999 not found (Status Code: 404)"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"

/channels/by-feed:
  get:
    summary: Get channels by feed IDs
    description: |
      Retrieve channels associated with specific RSS feed IDs with intelligent tracking of found/missing relationships.
      Accepts multiple feed IDs and returns comprehensive metadata about the lookup results.
      
      **Request Processing:**
      - Accepts comma-separated feed IDs in `feed_ids` parameter
      - Maximum 100 feed IDs per request (configurable via `max_ids`)
      - Performs validation and truncation if limits exceeded
      - Uses same eager loading as other channel endpoints
      
      **Response Metadata:**
      - `total`: Number of channels found
      - `requested_feed_ids`: Original request input
      - `found_feed_ids`: Feed IDs that had associated channels
      - `missing_feed_ids`: Feed IDs with no channels found
      
      **Data Structure:**
      Returns the same channel objects as list endpoint with:
      - Complete category information
      - Medium classification
      - All standard channel metadata
      
      **Use Cases:**
      - Bulk channel lookup operations
      - Feed-to-channel relationship analysis
      - Data validation and integrity checking
      - Migration and synchronization tools
      - Multi-feed dashboard views
      
      **Performance Considerations:**
      - Optimized with eager loading to prevent N+1 queries
      - Automatic limit enforcement for large requests
      - Efficient IN clause filtering on feed_id column
      
      **Rate Limiting**: 30 requests per minute
    tags:
      - Channels
    security:
      - Auth0Bearer: []
    parameters:
      - name: feed_ids
        in: query
        required: true
        schema:
          type: string
          pattern: '^[0-9]+(,[0-9]+)*$'
        description: |
          Comma-separated list of feed IDs to filter by.
          Example: "1,2,3,4,5"
          Maximum 100 feed IDs allowed per request.
      - name: max_ids
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: Maximum number of feed IDs allowed per request
    responses:
      '200':
        description: Channels found for the specified feed IDs
        content:
          application/json:
            schema:
              $ref: "../components/schemas/ChannelsByFeedResponse.yaml"
      '400':
        $ref: "../components/responses/BadRequest.yaml"
      '401':
        $ref: "../components/responses/Unauthorized.yaml"
      '403':
        $ref: "../components/responses/Forbidden.yaml"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"

/channels/export:
  get:
    summary: Export channel data in CSV or JSON format
    description: |
      Export comprehensive channel data in CSV or JSON format with flattened relationship data.
      Provides the same filtering and sorting options as the list endpoint but without pagination limits.
      
      **Export Data Structure:**
      - **Core Channel Fields**: id, id_text, slug, title, sortable_title, podcast_guid, feed_id, medium_id
      - **Technical Configuration**: has_podcast_index_value, has_value_time_splits, podcast_index_id
      - **Flattened Relationships**:
        - `medium_name`: Flattened from medium.value (e.g., "podcast", "blogL", "course")
        - `feed_url`: Flattened from feed.url (RSS feed URL)
        - `feed_status`: Flattened from feed.flag_status.status (feed parsing status)
        - `stats_*_count`: Flattened from stats aggregated data (all_time, month, week, day)
      
      **Export Formats:**
      - **CSV**: Returns downloadable file with proper headers and Content-Disposition
      - **JSON**: Returns structured array for programmatic processing
      
      **Filtering & Sorting:**
      Supports all the same options as list endpoint:
      - Text search on channel titles
      - Specific channel ID or podcast index ID filtering
      - Sorting by id or title (ascending/descending)
      - Row limit control via `max_rows` (default: 10,000, max: 50,000)
      
      **Performance & Limits:**
      - Eager loading prevents N+1 queries on large exports
      - Automatic row limit enforcement for server protection
      - Export logging for audit trails and monitoring
      - Timestamp-based filename generation for uniqueness
      
      **Use Cases:**
      - Analytics and business intelligence reporting
      - Data migration and backup operations
      - Channel performance analysis
      - Integration with external analytics platforms
      - Bulk data processing and transformation
      
      **Rate Limiting**: 10 requests per minute (lower due to potentially large data transfers)
      **Authentication**: Requires Auth0 Bearer token with admin access
      
    tags:
      - Channels
    security:
      - Auth0Bearer: []
    parameters:
      - $ref: "../components/parameters/query/export_format.yaml"
      - $ref: "../components/parameters/query/search.yaml"
      - $ref: "../components/parameters/query/sort_by.yaml"
      - $ref: "../components/parameters/query/sort_order.yaml"
      - $ref: "../components/parameters/query/id_filter.yaml"
      - $ref: "../components/parameters/query/podcast_index_id.yaml"
      - $ref: "../components/parameters/query/export_by.yaml"
      - name: max_rows
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50000
          default: 10000
        description: |
          Maximum number of rows to export (for performance). 
          Valid range: 1-50000. Values outside this range will fall back to 10000 (default).
    responses:
      '200':
        description: Channel data exported successfully
        headers:
          Content-Disposition:
            schema:
              type: string
              example: "attachment; filename=channels_export_20250725_063737_876549_admin_example_com.csv"
            description: Download filename with timestamp (CSV format only)
          Content-Type:
            schema:
              type: string
              enum: [text/csv, application/json]
              example: "text/csv"
            description: Content type based on export format
        content:
          text/csv:
            schema:
              type: string
              format: binary
              description: |
                CSV file with headers and flattened channel data.
                Includes all core fields plus computed relationship fields.
                Headers are dynamically generated from the export schema.
              example: |
                id,id_text,slug,title,feed_id,medium_name,feed_url,stats_all_time_count
                1,1130284ogiop7h,learn-away-travel,Light.,1,blogL,https://smith.net/feed.xml,6466
          application/json:
            schema:
              type: array
              items:
                type: object
                description: Channel object with flattened export data
              description: |
                JSON array of channel objects with all flattened relationship data.
                Same data as CSV but in structured format for API consumption.
              example:
                - id: 1
                  id_text: "1130284ogiop7h"
                  title: "Light."
                  medium_name: "blogL"
                  feed_url: "https://smith.net/feed.xml"
                  stats_all_time_count: 6466
      '400':
        $ref: "../components/responses/BadRequest.yaml"
      '401':
        $ref: "../components/responses/Unauthorized.yaml"
      '403':
        $ref: "../components/responses/Forbidden.yaml"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"
