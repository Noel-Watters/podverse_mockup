/stats/channels:
  get:
    summary: Retrieve aggregated channel statistics  
    description: |
      Returns aggregated statistics for channels with rich filtering and customizable view options.
      Provides comprehensive analytics data across multiple time periods with flexible response formats.
      
      **Data Sources**: 
      - Primary table: `stats_aggregated_channel` (precomputed statistics)
      - Joined table: `channel` (for search and channel metadata)
      
      **View Modes** (Controls response fields):
      - `daily`: Returns only daily count fields (day_current_count through day_8_count)
      - `weekly`: Returns only weekly count fields (week_current_count through week_4_count)  
      - `monthly`: Returns all fields including monthly and all-time counts (default)
      - `all_time`: Same as monthly, returns complete aggregated data
      
      **Search Capabilities**: 
      - Searches across channel titles using case-insensitive pattern matching
      - Exact match filtering by channel ID or multiple channel IDs
      
      **Sorting Options**: 
      - `channel_id`: Sort by channel identifier (default)
      - `day_current_count`: Sort by current day statistics
      - `week_current_count`: Sort by current week statistics  
      - `month_current_count`: Sort by current month statistics
      - `all_time_count`: Sort by all-time totals
      
      **Advanced Filtering**: 
      - Range filters for all time periods (daily, weekly, monthly, all-time counts)
      - Multiple channel ID filtering for batch analytics
      - Count-based filtering (min/max values for different periods)
      
      **Response Structure**:
      - Returns different field sets based on `view` parameter
      - Consistent pagination metadata with total counts
      - Optimized for analytics dashboards and reporting
      
      **Use Cases**:
      - Analytics dashboard data feeds
      - Channel performance comparisons
      - Time-series analysis across different periods
      - Bulk channel statistics for reporting
      
      **Rate Limiting**: 100 requests per minute

    tags:
      - Statistics
    security:
      - Auth0Bearer: []
    parameters:
      - $ref: "../components/parameters/query/view.yaml"
      - $ref: "../components/parameters/query/page.yaml"
      - $ref: "../components/parameters/query/search.yaml" 
      - $ref: "../components/parameters/query/sort_by.yaml"
      - $ref: "../components/parameters/query/sort_order.yaml"
      - $ref: "../components/parameters/query/id_filter.yaml"
      - name: channel_ids
        in: query
        schema:
          type: string
        description: Filter by multiple channel IDs (comma-separated)
      # Count range filtering 
      - name: min_daily_total
        in: query
        schema:
          type: integer
        description: Minimum daily total count
      - name: max_daily_total
        in: query
        schema:
          type: integer
        description: Maximum daily total count
      - name: min_weekly_total
        in: query
        schema:
          type: integer
        description: Minimum weekly total count
      - name: max_weekly_total
        in: query
        schema:
          type: integer
        description: Maximum weekly total count
      - name: min_all_time
        in: query
        schema:
          type: integer
        description: Minimum all-time count
      - name: max_all_time
        in: query
        schema:
          type: integer
        description: Maximum all-time count
      # Specific period filtering
      - name: min_current_day
        in: query
        schema:
          type: integer
        description: Minimum current day count
      - name: max_current_day
        in: query
        schema:
          type: integer
        description: Maximum current day count
      - name: min_current_week
        in: query
        schema:
          type: integer
        description: Minimum current week count
      - name: max_current_week
        in: query
        schema:
          type: integer
        description: Maximum current week count
      - name: min_current_month
        in: query
        schema:
          type: integer
        description: Minimum current month count
      - name: max_current_month
        in: query
        schema:
          type: integer
        description: Maximum current month count
    responses:
      '200':
        description: Channel statistics retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas/StatsChannelsResponse.yaml"
      '400':
        $ref: "../components/responses/BadRequest.yaml"
      '401':
        $ref: "../components/responses/Unauthorized.yaml"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"

/stats/channels/{id}:
  get:
    summary: Retrieve detailed statistics for a specific channel
    description: |
      Returns comprehensive detailed statistics and information for a specific channel.
      Includes complete channel metadata, associated feed information, items, and aggregated statistics.
      
      **Data Sources**:
      - Primary table: `channel` (channel metadata and relationships)
      - Related tables: `stats_aggregated_channel`, `feed`, `item`, `category`, `medium`
      - Event data: `stats_track_event_channel` (for raw event counting)
      
      **Response Includes**:
      - **Complete Channel Info**: ID, title, slug, podcast metadata, medium type
      - **Feed Information**: Associated RSS feed with parsing status and recent logs
      - **Categories**: All categories assigned to the channel with hierarchy
      - **Items**: Channel's episodes/items with flag status information
      - **Aggregated Statistics**: Full stats breakdown across all time periods
      - **Raw Event Count**: Computed event count for specified time range (if provided)
      
      **Optional Time Range Filtering**:
      - Use `start` and `end` parameters to filter raw event count calculation
      - Time range only affects the `raw_event_count` field, not aggregated stats
      - Accepts ISO 8601 datetime format (e.g., "2024-01-01T00:00:00")
      
      **Use Cases**:
      - Detailed channel analytics dashboards
      - Channel management and monitoring
      - Content analysis with episode listings
      - Performance tracking with feed parsing history
      
      **Rate Limiting**: 100 requests per minute
    tags:
      - Statistics  
    security:
      - Auth0Bearer: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Channel ID to retrieve detailed statistics for
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: |
          Start date for raw event count calculation (ISO 8601 format).
          Only affects raw_event_count field, not aggregated statistics.
        example: "2024-01-01T00:00:00"
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: |
          End date for raw event count calculation (ISO 8601 format).
          Only affects raw_event_count field, not aggregated statistics.
        example: "2024-12-31T23:59:59"
    responses:
      '200':
        description: Detailed channel statistics retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas/ChannelStatsDetailed.yaml"
      '400':
        $ref: "../components/responses/BadRequest.yaml"
      '401':
        $ref: "../components/responses/Unauthorized.yaml"
      '404':
        $ref: "../components/responses/NotFound.yaml"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"

/stats/items:
  get:
    summary: Retrieve aggregated item (episode) statistics
    description: |
      Returns aggregated statistics for podcast items/episodes with filtering and view options.
      Provides analytics data across multiple time periods for content performance analysis.
      
      **Data Sources**: 
      - Primary table: `stats_aggregated_item` (precomputed item statistics)
      - Joined table: `item` (for search and item metadata)
      
      **View Modes** (Controls response fields):
      - `daily`: Returns only daily count fields (day_current_count through day_8_count)
      - `weekly`: Returns only weekly count fields (week_current_count through week_4_count)  
      - `monthly`: Returns all fields including monthly and all-time counts (default)
      - `all_time`: Same as monthly, returns complete aggregated data
      
      **Search Capabilities**: 
      - Searches across item titles using case-insensitive pattern matching
      - Exact match filtering by item ID or multiple item IDs
      
      **Sorting Options**: 
      - `item_id`: Sort by item identifier (default)
      - `day_current_count`: Sort by current day statistics
      - `week_current_count`: Sort by current week statistics  
      - `month_current_count`: Sort by current month statistics
      - `all_time_count`: Sort by all-time totals
      
      **Advanced Filtering**: 
      - Range filters for all time periods (daily, weekly, monthly, all-time counts)
      - Multiple item ID filtering for batch analytics
      - Count-based filtering (min/max values for different periods)
      
      **Use Cases**:
      - Episode performance analysis
      - Content analytics and trending identification
      - Time-series analysis for item engagement
      - Bulk item statistics for reporting
      
      **Rate Limiting**: 100 requests per minute
      **Authentication**: Requires Auth0 Bearer token
      
      **Note**: This endpoint may have implementation issues that need resolution.

    tags:
      - Statistics
    security:
      - Auth0Bearer: []
    parameters:
      - $ref: "../components/parameters/query/view.yaml"
      - $ref: "../components/parameters/query/page.yaml"
      - $ref: "../components/parameters/query/search.yaml" 
      - $ref: "../components/parameters/query/sort_by.yaml"
      - $ref: "../components/parameters/query/sort_order.yaml"
      - $ref: "../components/parameters/query/id_filter.yaml"
      - name: item_ids
        in: query
        schema:
          type: string
        description: Filter by multiple item IDs (comma-separated)
      # Count range filtering (similar to channels)
      - name: min_daily_total
        in: query
        schema:
          type: integer
        description: Minimum daily total count
      - name: max_daily_total
        in: query
        schema:
          type: integer
        description: Maximum daily total count
      - name: min_weekly_total
        in: query
        schema:
          type: integer
        description: Minimum weekly total count
      - name: max_weekly_total
        in: query
        schema:
          type: integer
        description: Maximum weekly total count
      - name: min_all_time
        in: query
        schema:
          type: integer
        description: Minimum all-time count
      - name: max_all_time
        in: query
        schema:
          type: integer
        description: Maximum all-time count
      - name: min_current_day
        in: query
        schema:
          type: integer
        description: Minimum current day count
      - name: max_current_day
        in: query
        schema:
          type: integer
        description: Maximum current day count
      - name: min_current_week
        in: query
        schema:
          type: integer
        description: Minimum current week count
      - name: max_current_week
        in: query
        schema:
          type: integer
        description: Maximum current week count
      - name: min_current_month
        in: query
        schema:
          type: integer
        description: Minimum current month count
      - name: max_current_month
        in: query
        schema:
          type: integer
        description: Maximum current month count
    responses:
      '200':
        description: Item statistics retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: "../components/schemas/StatsAggregatedItem.yaml"
                meta:
                  type: object
                  properties:
                    page:
                      type: integer
                      example: 1
                    limit:
                      type: integer
                      example: 100
                    total:
                      type: integer
                      example: 500
                    view:
                      type: string
                      enum: [daily, weekly, monthly, all_time]
                      example: "monthly"
      '400':
        $ref: "../components/responses/BadRequest.yaml"
      '401':
        $ref: "../components/responses/Unauthorized.yaml"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"

/stats/items/{id}:
  get:
    summary: Retrieve detailed statistics for a specific item
    description: |
      Returns detailed information and statistics for a specific podcast item/episode.
      Includes basic item metadata and computed raw event count for the specified time range.
      
      **Data Sources**:
      - Primary table: `item` (item metadata)
      - Event data: `stats_track_event_item` (for raw event counting)
      
      **Response Includes**:
      - **Basic Item Info**: ID, title, GUID, publication date, slug
      - **Channel Relationship**: Channel ID and reference
      - **Statistics**: Aggregated statistics array (when available)
      - **Events**: Tracking events array (when available)
      - **Raw Event Count**: Computed event count for specified time range (if provided)
      
      **Optional Time Range Filtering**:
      - Use `start` and `end` parameters to filter raw event count calculation
      - Accepts ISO 8601 datetime format (e.g., "2024-01-01T00:00:00")
      
      **Use Cases**:
      - Individual episode performance analysis
      - Content engagement tracking
      - Detailed item analytics for specific episodes
      
      **Rate Limiting**: 100 requests per minute

    tags:
      - Statistics
    security:
      - Auth0Bearer: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Item ID to retrieve detailed statistics for
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: |
          Start date for raw event count calculation (ISO 8601 format).
          Filters events based on created_at timestamp.
        example: "2024-01-01T00:00:00"
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: |
          End date for raw event count calculation (ISO 8601 format).
          Filters events based on created_at timestamp.
        example: "2024-12-31T23:59:59"
    responses:
      '200':
        description: Detailed item statistics retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "../components/schemas/ItemStatsDetailed.yaml"
      '400':
        $ref: "../components/responses/BadRequest.yaml"
      '401':
        $ref: "../components/responses/Unauthorized.yaml"
      '404':
        $ref: "../components/responses/NotFound.yaml"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"