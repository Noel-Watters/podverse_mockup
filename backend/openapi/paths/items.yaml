/items:
  get:
    summary: List all items (episodes)
    description: |
      Returns a paginated list of podcast episodes with search, filtering, and sorting capabilities.
      Provides comprehensive access to episode metadata and status information.
      
      **Data Sources**: 
      - Primary table: `item` (episode/content metadata)
      - Joined tables: `channel` (for channel relationship), `item_flag_status` (for status details)
      
      **Search Capabilities**: 
      - Searches across item titles using case-insensitive pattern matching
      - No description search in current implementation
      
      **Sorting Options**: 
      - `id`: Sort by item identifier (default)
      - `title`: Sort by episode title
      - Supports both ascending and descending order
      
      **Filtering Options**:
      - Text search across item titles
      - Publication date range filtering (planned but not implemented)
      - Flag status filtering (planned but not implemented) 
      - Channel-based filtering (planned but not implemented)
      
      **Response Structure**:
      - Returns `data` array containing item objects
      - Each item includes nested `flag_status` object with full details
      - Meta object includes total count and pagination information
      - Uses limit/offset pagination model
      
      **Pagination**: 
      - `page`: Page number starting from 1
      - `limit`: Number of items per page (replaces per_page)
      - Response includes total count and calculated offset
      
      **Use Cases**:
      - Content management and episode browsing
      - Search and discovery of podcast episodes
      - Bulk episode status management
      - Analytics preparation and reporting
      
      **Rate Limiting**: 30 requests per minute
      
    tags:
      - Items
    security:
      - Auth0Bearer: []
    parameters:
      - $ref: "../components/parameters/query/limit.yaml"
      - $ref: "../components/parameters/query/page.yaml"
      - $ref: "../components/parameters/query/search.yaml"
      - $ref: "../components/parameters/query/sort_by.yaml"
      - $ref: "../components/parameters/query/sort_order.yaml"
    responses:
      '200':
        description: Items retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas/ItemsResponse.yaml"
      '400':
        $ref: "../components/responses/BadRequest.yaml"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"

/items/{id}:
  get:
    summary: Get item by ID
    description: |
      Retrieves detailed information for a specific podcast episode/item by its ID.
      Returns the same data structure as the list endpoint but for a single item.
      
      **Data Sources**:
      - Primary table: `item` (episode metadata)
      - Related tables: `item_flag_status` (for detailed status information)
      - Eager loading: channel, stats, flag_status relationships
      
      **Response Includes**:
      - **Complete Item Info**: ID, title, slug, publication date, GUIDs
      - **Channel Relationship**: Channel ID and reference
      - **Flag Status**: Full flag status object with lifecycle information
      - **Content Metadata**: Publication date, RSS identifiers, URL slug
      
      **Use Cases**:
      - Individual episode management and editing
      - Content details and metadata review
      - Episode status management
      - API integration for episode-specific operations
      
      **Rate Limiting**: 60 requests per minute 
    tags:
      - Items
    security:
      - Auth0Bearer: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Unique ID of the item to retrieve
        example: 1
    responses:
      '200':
        description: Item retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas/Item.yaml"
      '400':
        $ref: "../components/responses/BadRequest.yaml"
      '401':
        $ref: "../components/responses/Unauthorized.yaml"
      '404':
        $ref: "../components/responses/NotFound.yaml"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"