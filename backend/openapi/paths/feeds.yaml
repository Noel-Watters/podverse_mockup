/feeds/bulk-update:
  post:
    summary: Bulk update multiple feeds
    description: |
      Updates properties of multiple feeds simultaneously.
      This is useful for batch operations like:
      - Changing parsing priority for multiple feeds
      - Updating metadata across multiple feeds
      - Bulk feed configuration changes
      
      **Request Structure**:
      - `feed_ids`: Array of feed IDs to update (required, non-empty)
      - `updates`: Object containing fields to update (required, non-empty)
      
      **Allowed Update Fields**:
      - `parsing_priority`: Integer (0-5) - Frequency tier for parsing (0=rarely, 5=frequently)
      - `feed_flag_status_id`: Integer - Must be a valid flag status ID from the database
      - `container_id`: String - Container ID for internal grouping (e.g., regions)
      
      **Validation Rules**:
      - Only the above fields are allowed for updates
      - `feed_flag_status_id` must reference an existing flag status
      - Invalid fields will result in a 400 error
      
      **Status Values**:
      - `updated`: Feed was successfully updated
      - `not_found`: Feed ID doesn't exist
      
      **Rate Limiting**: 4 requests per minute
    tags:
      - Feeds
    security:
      - Auth0Bearer: []
    parameters:
      - name: async
        in: query
        required: false
        description: Whether to run updates asynchronously (note response format may not change)
        schema:
          type: boolean
          default: false
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - feed_ids
              - updates
            properties:
              feed_ids:
                type: array
                items:
                  type: integer
                minItems: 1
                description: List of feed IDs to update
              updates:
                type: object
                minProperties: 1
                description: Object containing fields to update
                properties:
                  parsing_priority:
                    type: integer
                    minimum: 0
                    maximum: 5
                    description: Parsing priority (0=rarely, 5=frequently)
                  feed_flag_status_id:
                    type: integer
                    description: Flag status ID for the feed (must be a valid ID from the database)
                  container_id:
                    type: string
                    description: Container ID for the feed
    responses:
      '200':
        description: Bulk update completed successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas/FeedBulkUpdate.yaml"
      '400':
        description: Invalid request parameters
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "updates must be a non-empty object"
                  description: |
                    Possible error messages:
                    - "updates must be a non-empty object"
                    - "feed_ids must be a non-empty list" 
                    - "Invalid update fields: {'invalid_field'}"
                    - "Invalid feed_flag_status_id: 999"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"

/feeds/bulk-reparse:
  post:
    summary: Bulk reparse multiple feeds
    description: |
      Triggers reparse for multiple feeds simultaneously.
      This is useful for batch operations like:
      - Refreshing multiple feeds that may have stale content
      - Retrying feeds that previously failed to parse
      - Bulk feed maintenance operations
      
      **Eligibility Rules**:
      - Only feeds with status `active`, `always-parse`, or `parse_error` are eligible
      - Feeds with status `archived`, `spam`, `fetch_error`, `pending-archive`, or `takedown` are skipped
      - Feeds that are already being parsed return `already_parsing` status
      
      **Async vs Sync**:
      - Default behavior (sync): Returns detailed results for each feed
      - With `async=true`: Queues the operation and returns `{"status": "queued"}`
      
      **Status Values**:
      - `success`: Feed was successfully queued for reparse
      - `skipped_flag`: Feed was skipped due to ineligible status
      - `not_found`: Feed ID doesn't exist
      - `error`: Database error (e.g., invalid feed ID format)
      - `already_parsing`: Feed is currently being parsed
      
      **Rate Limiting**: 4 requests per minute
    tags:
      - Feeds
    security:
      - Auth0Bearer: []
    parameters:
      - name: async
        in: query
        required: false
        description: Whether to run reparses asynchronously
        schema:
          type: boolean
          default: false
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - feed_ids
            properties:
              feed_ids:
                type: array
                items:
                  type: integer
                minItems: 1
                description: List of feed IDs to reparse
              async:
                type: boolean
                default: false
                description: Whether to run reparses asynchronously (redundant with query param)
    responses:
      '200':
        description: Bulk reparse completed successfully
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../components/schemas/FeedBulkReparse.yaml"
                - type: object
                  properties:
                    status:
                      type: string
                      enum: [queued]
                      description: Status indicating the bulk reparse was queued
                  required: [status]
      '400':
        description: Invalid request parameters
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "feed_ids must be a non-empty list"
                  description: |
                    Possible error messages:
                    - "feed_ids must be a non-empty list"
                    - "Request body is required"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"

/feeds/auto-reparse-status:
  get:
    summary: Get auto-reparse system status
    description: |
      Returns information about the auto-reparse system status.
      This endpoint provides insights into the automated feed parsing system.
      
      **Response Structure**:
      - `auto_reparse_running`: Boolean indicating if auto-reparse is currently active
      - `status`: Human-readable status ("running" or "idle")
      
      **Status Meanings**:
      - `"running"`: The automated feed parsing system is currently active and processing feeds
      - `"idle"`: The automated feed parsing system is not currently active (waiting/idle)
      
      This endpoint is useful for monitoring the automated feed parsing system
      and checking if background tasks are currently active.

      **Rate Limiting**: 10 requests per minute
    tags:
      - Feeds
    security:
      - Auth0Bearer: []
    responses:
      '200':
        description: Auto-reparse status retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_reparse_running:
                  type: boolean
                  description: Whether the auto-reparse system is currently running
                  example: false
                status:
                  type: string
                  enum: [running, idle]
                  description: Human-readable status of the auto-reparse system
                  example: "idle"
              required: [auto_reparse_running, status]
      '429':
        $ref: "../components/responses/RateLimit.yaml" 