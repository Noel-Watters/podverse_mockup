/feeds:
  get:
    summary: Retrieve a list of RSS feeds 
    description: |
      Returns a paginated list of RSS feeds including each feed's URL, status, and associated metadata.
      Supports optional search, limit, and offset parameters for pagination and filtering.
      Data is sourced from the `feed` table, joined with `feed_flag_status` for human-readable status labels.
      
      **Search**: Search across feed ID (exact match), feed URL (partial), channel title (partial), and podcast index ID (exact match).
      **Sorting**: Sort by feed ID, feed URL, or updated at.
      
      **Filtering Options**:
      - `status`: Filter by flag status (active, archived, spam, parse_error, fetch_error, always-parse, pending-archive, takedown)
      - `is_parsing`: Filter by parsing state (true/false)
      - `parsing_priority`: Filter by parsing priority (0-5)
      - `podcast_index_id`: Filter by podcast index ID
      - `feed_id`: Filter by specific feed ID

      **Rate Limiting**: 50 requests per minute
    tags:
      - Feeds
    security:
      - Auth0Bearer: []
    parameters:
      - $ref: "../components/parameters/query/limit.yaml"
      - $ref: "../components/parameters/query/page.yaml"
      - $ref: "../components/parameters/query/search.yaml"
      - $ref: "../components/parameters/query/id_filter.yaml"
      - $ref: "../components/parameters/query/podcast_index_id.yaml"
      - $ref: "../components/parameters/query/sort_order.yaml"
      - $ref: "../components/parameters/query/sort_by.yaml"
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [active, archived, spam, parse_error, fetch_error, always-parse, pending-archive, takedown]
        description: Filter feeds by flag status
      - name: is_parsing
        in: query
        required: false
        schema:
          type: boolean
        description: Filter feeds by parsing state
      - name: parsing_priority
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 5
        description: Filter feeds by parsing priority (0=rarely, 5=frequently)
    responses:
      '200':
        description: List of feeds returned
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: "../components/schemas/Feed.yaml"
                meta:
                  type: object
                  properties:
                    total_items:
                      type: integer
                      description: Total number of feeds matching the query
                    total_pages:
                      type: integer
                      description: Total number of pages
                    page:
                      type: integer
                      description: Current page number
                    limit:
                      type: integer
                      description: Number of items per page
                    has_next:
                      type: boolean
                      description: Whether there are more pages
                    has_prev:
                      type: boolean
                      description: Whether there are previous pages
      '400':
        $ref: "../components/responses/BadRequest.yaml"
      '429':
        $ref: "../components/responses/RateLimit.yaml"
      '500':
        $ref: "../components/responses/InternalServerError.yaml"

/feeds/{feed_id}:
  get:
    summary: Get a specific feed by ID
    description: |
      Retrieves detailed information about a specific RSS feed by its ID.
      
      **Response includes:**
      - Basic feed information (ID, URL, parsing priority, timestamps)
      - Channel information (title, podcast index ID)
      - Flag status as human-readable string
      - Recent parsing logs (2 most recent entries)
      - Parsing state and metadata
      
      **Computed Fields:**
      - `channel_title`: Title of the associated channel
      - `channel_podcast_index_id`: Podcast Index ID of the channel  
      - `flag_status`: Human-readable status (e.g., active, archived, spam)
      - `recent_logs`: Array of the 2 most recent parsing logs
      
      This endpoint provides comprehensive feed information for detailed views
      and feed management operations.

      **Rate Limiting**: 50 requests per minute
    tags:
      - Feeds
    security:
      - Auth0Bearer: []
    parameters:
      - $ref: "../components/parameters/path/feed_id.yaml"
    responses:
      '200':
        description: Feed retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas/Feed.yaml"
      '404':
        $ref: "../components/responses/NotFound.yaml"
      '429':
        $ref: "../components/responses/RateLimit.yaml"

/feeds/{feed_id}/reparse:
  post:
    summary: Trigger manual reparse of a specific feed
    description: |
      Manually triggers parsing of a specific RSS feed. This endpoint allows immediate parsing
      of feeds without waiting for the scheduled parsing cycle.
      
      **Eligibility Rules**:
      - Only feeds with status `active`, `always-parse`, or `parse_error` are eligible
      - Feeds with status `archived`, `spam`, `fetch_error`, `pending-archive`, or `takedown` are rejected
      - Feeds that are already being parsed (`is_parsing=true`) return a 409 conflict
      
      **Async vs Sync**:
      - Default behavior (sync): Returns immediate result with feed_id and success status
      - With `async=true`: Queues the reparse and returns `{"status": "queued"}`
      
      **Response Patterns**:
      - Success (sync): `{"feed_id": 5, "message": "...", "status": "success", "success": true}`
      - Success (async): `{"status": "queued"}`
      - Conflict: `{"error": "Feed is already being parsed"}`
      - Not eligible: `{"error": "Feed is not eligible for parsing (status: archived)"}`

      **Rate Limiting**: 10 requests per minute
    tags:
      - Feeds
    security:
      - Auth0Bearer: []
    parameters:
      - $ref: "../components/parameters/path/feed_id.yaml"
      - name: async
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Whether to run the reparse asynchronously
    responses:
      '200':
        description: Reparse initiated successfully
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    feed_id:
                      type: integer
                      description: ID of the feed being reparsed
                    message:
                      type: string
                      description: Status message from the parser
                    status:
                      type: string
                      enum: [success]
                      description: Status of the reparse operation
                    success:
                      type: boolean
                      description: Whether the reparse was successful
                  required: [feed_id, message, status, success]
                - type: object
                  properties:
                    status:
                      type: string
                      enum: [queued]
                      description: Status indicating the reparse was queued
                  required: [status]
      '400':
        description: Feed is not eligible for parsing
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Feed is not eligible for parsing (status: archived)"
      '404':
        $ref: "../components/responses/NotFound.yaml"
      '409':
        description: Feed is already being parsed
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Feed is already being parsed"
      '429':
        $ref: "../components/responses/RateLimit.yaml"

/feeds/{feed_id}/logs:
  get:
    summary: Retrieve parsing logs for a specific feed
    description: |
      Returns parsing logs for a specific feed with pagination and filtering options.
      Logs are sorted by finished_at in descending order (newest first).
      
      **Pagination**: Supports `page` and `limit` parameters for paginated results
      **Filtering**: Supports `success_only` and `error_only` parameters to filter by parsing success (mutually exclusive)
      
      **Response Structure**:
      - `logs`: Array of parsing log entries
      - `meta`: Pagination metadata (page, limit, total_items, total_pages, has_next, has_prev)
      - Each log contains parsing metadata, HTTP status, success/failure status, and error messages
      
      **Rate Limiting**: 50 requests per minute
    tags:
      - Feeds
    security:
      - Auth0Bearer: []
    parameters:
      - $ref: "../components/parameters/path/feed_id.yaml"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number for pagination
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Number of logs per page
      - name: success_only
        in: query
        required: false
        schema:
          type: boolean
        description: Filter to show only successful parsing attempts (mutually exclusive with error_only)
      - name: error_only
        in: query
        required: false
        schema:
          type: boolean
        description: Filter to show only failed parsing attempts (mutually exclusive with success_only)
    responses:
      '200':
        description: Feed logs retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                logs:
                  type: array
                  items:
                    $ref: "../components/schemas/FeedLog.yaml"
                  description: Array of parsing logs for the current page
                meta:
                  type: object
                  properties:
                    page:
                      type: integer
                      description: Current page number
                    limit:
                      type: integer
                      description: Number of logs per page
                    total_items:
                      type: integer
                      description: Total number of logs matching the filter
                    total_pages:
                      type: integer
                      description: Total number of pages
                    has_next:
                      type: boolean
                      description: Whether there are more pages
                    has_prev:
                      type: boolean
                      description: Whether there are previous pages
      '400':
        $ref: "../components/responses/BadRequest.yaml"
      '404':
        $ref: "../components/responses/NotFound.yaml"
      '429':
        $ref: "../components/responses/RateLimit.yaml"

/feeds/{feed_id}/export:
  get:
    summary: Export a single feed
    description: |
      Exports a single feed in CSV or JSON format with comprehensive metadata including:
      - Basic feed information (ID, URL, parsing priority, timestamps)
      - Channel information (title, podcast index ID, channel issues)
      - Parsing history and error tracking (last parse error, error count, last successful parse)
      - Flag status and operational metadata
      
      **Export Formats**:
      - **CSV** (default): Comma-separated values with headers, suitable for spreadsheet analysis
      - **JSON**: Array containing feed object with all metadata, suitable for programmatic use
      
      **CSV Fields**:
      - id, url, parsing_priority, is_parsing, created_at, updated_at
      - flag_status, channel_title, channel_podcast_index_id
      - last_parse_error, parse_error_count, last_successful_parse_at, channel_issue
      
      **Use Cases**:
      - Individual feed analysis and debugging
      - Feed metadata review and auditing
      - Exporting feed data for external tools
      - Generating reports for specific feeds
      
      **Features**:
      - Redis locking prevents concurrent exports of the same feed (5-minute timeout)
      - Automatic export logging for audit trails
      - Filename includes timestamp and user ID for tracking
      - Comprehensive error handling with detailed messages
      - Concurrent access protection with automatic lock release
      
      **Rate Limiting**: 10 requests per minute (protects against large download spam)
      **Authentication**: Requires Auth0Bearer token
      **Audit**: All exports are logged for compliance and monitoring
    tags:
      - Feeds
    security:
      - Auth0Bearer: []
    parameters:
      - $ref: "../components/parameters/path/feed_id.yaml"
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum: [csv, json]
          default: csv
        description: Export format (csv or json)
    responses:
      '200':
        description: Feed exported successfully
        headers:
          Content-Disposition:
            schema:
              type: string
              example: "attachment; filename=feed_1_export_20250720_041101_283207_flask.csv"
            description: Filename for download with timestamp and user ID
          Content-Type:
            schema:
              type: string
              enum: ["text/csv", "application/json"]
            description: MIME type based on format
        content:
          text/csv:
            schema:
              type: string
              description: CSV format with headers and feed data
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/FeedExport.yaml"
              description: JSON array containing feed export data
      '400':
        description: Invalid request parameters
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Unsupported format. Use 'csv', 'json'"
      '404':
        description: Feed not found
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Feed not found (Status Code: 404)"
      '429':
        $ref: "../components/responses/RateLimit.yaml"

/feeds/export:
  get:
    summary: Export feeds as CSV or JSON metadata
    description: |
      Exports feed data in either CSV or JSON format with comprehensive metadata:

      **Export Formats**:
